<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jeROMy — ROM Hacking Agent</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --jer-bg: #0f0f0f;
      --jer-surface: #1a1a1a;
      --jer-border: #333;
      --jer-text: #e0e0e0;
      --jer-text-muted: #888;
      --jer-accent: #69db7c;
      --jer-accent-blue: #74c0fc;
      --jer-accent-orange: #dba66b;
      --jer-error: #ff6b6b;
      --jer-font: 'Segoe UI', system-ui, sans-serif;
      --jer-font-mono: 'Cascadia Code', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--jer-font);
      background: var(--jer-bg);
      color: var(--jer-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ======== Header ======== */

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--jer-border);
      flex-shrink: 0;
    }
    .header h1 { font-size: 20px; color: #fff; }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--jer-text-muted);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--jer-error);
    }
    .status-dot.connected { background: var(--jer-accent); }

    /* ======== Main Layout ======== */

    .main {
      display: grid;
      grid-template-columns: 380px 1fr;
      flex: 1;
      overflow: hidden;
    }

    /* ======== Left Sidebar: Emulator + Controls ======== */

    .sidebar {
      border-right: 1px solid var(--jer-border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--jer-surface);
      border: 1px solid var(--jer-border);
      border-radius: 8px;
      padding: 12px;
    }
    h2 {
      font-size: 13px;
      margin-bottom: 8px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Emulator View */
    .emu-view canvas {
      display: block;
      border: 2px solid #444;
      cursor: crosshair;
      image-rendering: pixelated;
      width: 100%;
      aspect-ratio: 256 / 240;
    }
    .click-info {
      margin-top: 6px;
      font-size: 12px;
      color: #666;
    }

    /* Buttons */
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    button {
      background: #2a2a2a;
      color: var(--jer-text);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #3a3a3a; border-color: #666; }
    button:active { background: #444; }
    button.primary { background: #1a5c2e; border-color: #2a7a3e; }
    button.primary:hover { background: #2a7a3e; }
    button.danger { background: #5c1a1a; border-color: #7a2a2a; }
    button.danger:hover { background: #7a2a2a; }

    /* Palette Display */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 28px);
      gap: 2px;
      margin-bottom: 6px;
    }
    .palette-row-label { font-size: 10px; color: #666; margin-bottom: 2px; }
    .color-swatch {
      width: 28px;
      height: 28px;
      border: 1px solid #555;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .color-swatch:hover { border-color: #fff; }
    .color-swatch .index {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 0 2px #000;
    }

    /* Tile Info */
    .tile-info {
      font-family: var(--jer-font-mono);
      font-size: 11px;
      background: #111;
      padding: 6px;
      border-radius: 4px;
      min-height: 50px;
      white-space: pre-wrap;
    }

    /* Session List */
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 200px;
      overflow-y: auto;
    }
    .session-entry {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .session-entry:hover { background: #2a2a2a; }
    .session-entry.active {
      background: #1a3a2a;
      border-color: #2a5a3a;
    }
    .session-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .session-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--jer-accent);
      flex-shrink: 0;
    }
    .session-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-count {
      font-size: 11px;
      color: var(--jer-text-muted);
      font-family: var(--jer-font-mono);
    }
    .session-meta {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
      padding-left: 12px;
    }

    /* Log */
    .log {
      background: #111;
      border: 1px solid var(--jer-border);
      border-radius: 4px;
      padding: 6px;
      font-family: var(--jer-font-mono);
      font-size: 11px;
      height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log .error { color: var(--jer-error); }
    .log .success { color: var(--jer-accent); }
    .log .info { color: var(--jer-accent-blue); }

    /* ======== Chat Panel (right side) ======== */

    .chat-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Scrollable chat area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Virtual list content container (populated by VirtualListActor) */
    .virtual-list-content {
      display: flex;
      flex-direction: column;
    }

    /* Individual turn host elements (created by pool) */
    .virtual-list-turn {
      margin-bottom: 4px;
    }

    /* Chat input area (populated by InputAreaActor's Shadow DOM) */
    .chat-input-area {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>jeROMy</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>

  <div class="main">
    <!-- Left Sidebar: Sessions + Emulator + Controls -->
    <div class="sidebar">
      <div class="panel" id="sessionsPanel">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px">
          <h2 style="margin-bottom:0">Sessions</h2>
          <button data-session-action="new" title="New Session" style="padding:2px 8px; font-size:14px">+</button>
        </div>
        <div class="session-list" id="sessionList"></div>
        <div class="btn-row" style="margin-top:6px">
          <button data-session-action="fork">Fork</button>
          <button data-session-action="delete" class="danger">Delete</button>
        </div>
      </div>

      <div class="panel">
        <h2>Emulator</h2>
        <div class="emu-view">
          <canvas id="screen" width="256" height="240"></canvas>
          <div class="click-info" id="clickInfo">Click on the screen to inspect a tile</div>
        </div>
        <div class="btn-row" style="margin-top: 8px;">
          <button class="primary" data-action="screenshot">Screenshot</button>
          <button data-action="auto-refresh">Auto-Refresh</button>
          <button data-action="stop-refresh">Stop</button>
          <button data-action="attach" title="Attach current frame to next chat message"
                  style="background:#1a3a5c; border-color:#2a5a8c">Attach</button>
        </div>
        <div class="btn-row" style="margin-top: 4px;">
          <button data-action="pause-emu" style="background:#5c4a1a; border-color:#7a6a2a">Pause</button>
          <button data-action="step-frame" style="background:#5c4a1a; border-color:#7a6a2a">Step</button>
          <button data-action="resume-emu" style="background:#1a5c2e; border-color:#2a7a3e">Resume</button>
        </div>
      </div>

      <div class="panel">
        <h2>Tile Info</h2>
        <div class="tile-info" id="tileInfo">Click a pixel to inspect</div>
      </div>

      <div class="panel">
        <h2>Connection</h2>
        <div class="btn-row">
          <button data-action="ping">Ping</button>
          <button data-action="rom-info">ROM Info</button>
          <button data-action="cpu-state">CPU State</button>
        </div>
      </div>

      <div class="panel">
        <h2>Palettes</h2>
        <div id="paletteContainer">
          <button data-action="load-palettes">Load Palettes</button>
        </div>
      </div>

      <div class="panel">
        <h2>Log</h2>
        <div class="log" id="log"></div>
        <div class="btn-row" style="margin-top: 6px;">
          <button data-action="export-logs">Export</button>
          <button data-action="clear-logs">Clear</button>
        </div>
      </div>
    </div>

    <!-- Right: Chat Panel -->
    <div class="chat-panel">
      <div class="chat-scroll"></div>
      <div class="chat-input-area"></div>
    </div>
  </div>

  <script type="module" src="/chat.js"></script>
</body>
</html>
